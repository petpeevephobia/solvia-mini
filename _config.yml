# Jekyll Configuration for Solvia Labs
# This minimal config enables Jekyll to work alongside existing static HTML files

# Site settings
title: "Solvia Labs"
description: "Web Development for Startups | Fast, Collaborative, Founder-friendly"
baseurl: ""
url: "https://solvia.app"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# CSS Minifier
minifier:
  compress_css: true
  compress_html: true

# Exclude files from processing
exclude:
  - README.md
  - backend
  - docs
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - .git
  - .gitignore
