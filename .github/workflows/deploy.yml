name: Deploy Solvia Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SERVER_HOST: 72.60.195.244
  SERVER_USER: root
  SOURCE_DIR: /opt/solvia-site
  LANDING_DIR: /opt/solvia/landing

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH with official action
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Test SSH connection
      run: |
        ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "echo '✅ SSH connection successful'"

    - name: Deploy to Server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
          set -e  # Exit on any error

          echo "🔄 Starting deployment..."

          # Update source repository
          cd ${{ env.SOURCE_DIR }}
          echo "📥 Pulling latest code from GitHub..."
          git fetch origin
          git reset --hard origin/main
          git pull origin main
          echo "✅ Source code updated"

          # Ensure landing directory exists
          mkdir -p ${{ env.LANDING_DIR }}

          # Sync _site contents to landing directory (served by Caddy)
          echo "📦 Syncing _site to landing directory..."
          rsync -av --delete ${{ env.SOURCE_DIR }}/_site/ ${{ env.LANDING_DIR }}/
          echo "✅ Landing files synced"

          # Set permissions
          echo "🔧 Setting permissions..."
          chown -R root:root ${{ env.LANDING_DIR }} 2>/dev/null || true
          chmod -R 755 ${{ env.LANDING_DIR }}

          # Lead audit API (FastAPI): sync deps and restart if service is installed
          if [ -f ${{ env.SOURCE_DIR }}/backend/requirements.txt ]; then
            echo "🐍 Updating backend venv..."
            cd ${{ env.SOURCE_DIR }}/backend
            test -d .venv || python3 -m venv .venv
            .venv/bin/pip install -q -r requirements.txt
            systemctl try-restart solvia-audit-api 2>/dev/null || echo "⚠️ solvia-audit-api not installed or restart skipped"
            echo "✅ Backend sync complete"
          fi

          echo "✅ Landing page deployed successfully!"
        ENDSSH

    - name: Verify Deployment
      run: |
        sleep 5
        response=$(curl -s -o /dev/null -w "%{http_code}" https://solvia.app/ || echo "000")
        echo "Landing page response: $response"

        if [ "$response" = "200" ] || [ "$response" = "308" ] || [ "$response" = "301" ]; then
          echo "✅ Landing page is accessible"
        else
          echo "⚠️ Landing page returned: $response"
        fi

        api=$(curl -s -o /dev/null -w "%{http_code}" https://solvia.app/api/health || echo "000")
        echo "API /api/health response: $api"
        if [ "$api" = "200" ]; then
          echo "✅ Lead audit API health OK"
        else
          echo "⚠️ Lead audit API not reachable or not configured (expected until Caddy + systemd are set up)"
        fi

    - name: Notify Success
      if: success()
      run: echo "🚀 Solvia Landing Page deployed successfully!"

    - name: Notify Failure
      if: failure()
      run: echo "❌ Deployment failed. Check logs for details."