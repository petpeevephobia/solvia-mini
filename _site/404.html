<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Solvia Labs</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-content h1 {
            font-size: 6rem;
            color: #EC6019;
            margin-bottom: 1rem;
        }
        .error-content h2 {
            margin-bottom: 1rem;
        }
        .error-content p {
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>Oops! The page you're looking for doesn't exist.</p>
            <a href="/" class="btn btn-primary">Go Home</a>
        </div>
    </div>

    <!-- Cookie Consent Banner -->
    <div id="cookie-consent-banner" class="cookie-consent-banner">
        <div class="cookie-consent-content">
            <svg class="cookie-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
                <circle cx="8" cy="8" r="1.5" fill="#EC6019"/>
                <circle cx="16" cy="8" r="1.5" fill="#EC6019"/>
                <circle cx="12" cy="12" r="1.5" fill="#EC6019"/>
                <circle cx="8" cy="16" r="1.5" fill="#EC6019"/>
                <circle cx="16" cy="16" r="1.5" fill="#EC6019"/>
            </svg>
            <p>We use cookies to analyse site traffic and improve your experience. <a href="/privacy-policy.html">Learn more</a></p>
            <div class="cookie-consent-buttons">
                <button id="cookie-accept" class="btn-accept">Accept</button>
                <button id="cookie-deny" class="btn-deny">Deny</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/cookie-consent.js"></script>
</body>
</html>
